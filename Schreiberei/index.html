<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Schreiberei - Home to Bar Tatar & Tohru">
  <title>Schreiberei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <!-- Logo -->
    <header class="header">
      <img src="images/logo-schreiberei.svg" alt="Schreiberei" class="logo">
    </header>

    <!-- Restaurant Cards -->
    <main class="restaurants">
      <!-- Bar Tatar -->
      <a href="https://bartatar.de" class="card" target="_blank" rel="noopener">
        <svg class="card__bg" viewBox="0 0 406 480" preserveAspectRatio="none">
          <path d="M0.0442023 480V75.8616C26.5157 37.0692 107.698 0 203.022 0C298.346 0 379.528 37.0692 406 75.8616V480H0H0.0442023Z" fill="#1D1D1B"/>
        </svg>
        <div class="card__content">
          <img src="images/bar-tatar-logo.svg" alt="Bar Tatar" class="card__logo card__logo--bt">
        </div>
        <span class="card__cta card__cta--gold">Enter Bar Tatar</span>
      </a>

      <!-- Tohru -->
      <a href="https://tohru-nakamura-website.vercel.app" class="card" target="_blank" rel="noopener">
        <svg class="card__bg" viewBox="0 0 406 480" preserveAspectRatio="none">
          <path d="M0 94.3828C0 37.0285 41.4926 7.90942 89.1273 7.90942C128.852 7.90942 134.155 23.8166 160.624 23.8166C183.557 23.8166 190.627 0 203 0C215.373 0 222.399 23.8166 245.376 23.8166C271.845 23.8166 277.148 7.90942 316.873 7.90942C364.552 7.90942 406 37.0285 406 94.3828V480H0V94.3828Z" fill="#800020"/>
        </svg>
        <div class="card__content">
          <img src="images/tohru-logo.svg" alt="Tohru" class="card__logo card__logo--tohru">
          <div class="michelin-stars">
            <img src="images/michelin-star.png" alt="Michelin Star" class="michelin-star">
            <img src="images/michelin-star.png" alt="Michelin Star" class="michelin-star">
            <img src="images/michelin-star.png" alt="Michelin Star" class="michelin-star">
          </div>
        </div>
        <span class="card__cta card__cta--white">Enter Tohru</span>
      </a>
    </main>

    <!-- Tagline -->
    <footer class="footer">
      <p class="tagline">Home to Bar Tatar & Tohru.</p>
    </footer>
  </div>
</body>
</html>
