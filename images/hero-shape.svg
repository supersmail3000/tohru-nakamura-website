      <!-- Organische Form basierend auf dem Figma Design: 503x600px -->
      <path d="M 40 60 
               C 80 35 120 25 170 20
               C 220 18 250 15 280 10
               C 310 18 340 25 380 30
               C 420 40 460 50 480 70
               L 490 100
               L 500 550
               C 500 570 490 585 470 595
               C 450 600 400 600 350 600
               L 150 600
               C 100 600 50 600 30 595
               C 10 585 3 570 3 550
